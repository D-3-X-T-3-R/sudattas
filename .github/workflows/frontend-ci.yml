name: Frontend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - 'docs/user-journeys-blueprint.md'
      - 'scripts/check-user-journeys-blueprint.mjs'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - 'docs/user-journeys-blueprint.md'
      - 'scripts/check-user-journeys-blueprint.mjs'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint -- --max-warnings=0

    - name: Unit Tests
      working-directory: ./frontend
      run: npm run test

    - name: Build
      working-directory: ./frontend
      run: npm run build

    - name: Frontend performance budgets
      run: node ./scripts/check-frontend-performance-budgets.mjs

    - name: Contract discipline
      run: node ./scripts/check-contract-discipline.mjs

    - name: Journey blueprint discipline
      run: node ./scripts/check-user-journeys-blueprint.mjs

  journey-e2e:
    name: Journey E2E (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: lint-build
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: storefront-and-cart
            sections: "1,2,3,4,5"
          - name: checkout-and-payments
            sections: "6,7"
          - name: auth-and-account
            sections: "8,9"
          - name: admin-and-security
            sections: "10,11"
          - name: reliability-and-platform
            sections: "12,13,14,15,16"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: sudattas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend -> target

    - name: Install protobuf compiler and redis-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev redis-tools
        protoc --version

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Setup backend test database schema
      run: |
        sleep 10
        mysql -h 127.0.0.1 -P 3306 -u root -ptest_password < backend/database/sql_dump/01_schema.sql
        chmod +x ./backend/scripts/apply_sql_migrations.sh
        ./backend/scripts/apply_sql_migrations.sh 127.0.0.1 3306 root test_password SUDATTAS ./backend/database/migrations

    - name: Build backend binaries
      working-directory: ./backend
      run: cargo build -p core_operations -p graphql --all-features

    - name: Build frontend
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_GRAPHQL_URL: http://127.0.0.1:8080/v2
      run: npm run build

    - name: Install Playwright browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Start backend and run Playwright journey scenarios
      env:
        DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/SUDATTAS
        REDIS_URL: redis://127.0.0.1:6379
        GRPC_SERVER: 0.0.0.0:50051
        GRPC_URL: http://127.0.0.1:50051
        GRAPHQL_URL: http://127.0.0.1:8080/v2
        NEXT_PUBLIC_GRAPHQL_URL: http://127.0.0.1:8080/v2
        OAUTH_DOMAIN: https://accounts.google.com/
        OAUTH_AUDIENCE: https://www.googleapis.com/oauth2/v3/tokeninfo
        INTERNAL_API_SECRET: ci-e2e-internal-secret
        AUTH_SECRET: ci-frontend-auth-secret
        ADMIN_ALLOWED_EMAILS: admin@example.com
        JOURNEY_SECTIONS: ${{ matrix.shard.sections }}
      run: |
        set -euo pipefail
        chmod +x ./backend/scripts/wait_for_http_ready.sh
        ./backend/target/debug/core_operations > /tmp/core_operations.log 2>&1 &
        CORE_PID=$!
        ./backend/target/debug/graphql > /tmp/graphql.log 2>&1 &
        GRAPHQL_PID=$!

        cleanup() {
          kill "$CORE_PID" "$GRAPHQL_PID" 2>/dev/null || true
        }
        trap cleanup EXIT

        # Fail fast if either background process exits immediately.
        sleep 3
        if ! kill -0 "$CORE_PID" 2>/dev/null; then
          echo "core_operations failed to start"
          tail -n 200 /tmp/core_operations.log || true
          exit 1
        fi
        if ! kill -0 "$GRAPHQL_PID" 2>/dev/null; then
          echo "graphql failed to start"
          tail -n 200 /tmp/graphql.log || true
          exit 1
        fi

        ./backend/scripts/wait_for_http_ready.sh http://127.0.0.1:8080/ready 90 3
        cd frontend
        echo "Running logical shard '${{ matrix.shard.name }}' with sections: ${JOURNEY_SECTIONS}"
        PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e:journeys -- --reporter=line

    - name: Upload backend logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-ci-backend-logs-${{ matrix.shard.name }}
        path: |
          /tmp/core_operations.log
          /tmp/graphql.log
        if-no-files-found: ignore
