name: Frontend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - 'docs/user-journeys-blueprint.md'
      - 'docs/user-journeys-catalog-5000.md'
      - 'docs/user-journeys-provider-live.md'
      - 'scripts/check-user-journeys-blueprint.mjs'
      - 'scripts/check-provider-safe-journey-catalogs.mjs'
      - 'scripts/check-journey-catalog-mapping.mjs'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - 'docs/user-journeys-blueprint.md'
      - 'docs/user-journeys-catalog-5000.md'
      - 'docs/user-journeys-provider-live.md'
      - 'scripts/check-user-journeys-blueprint.mjs'
      - 'scripts/check-provider-safe-journey-catalogs.mjs'
      - 'scripts/check-journey-catalog-mapping.mjs'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint -- --max-warnings=0

    - name: Unit Tests
      working-directory: ./frontend
      run: npm run test

    - name: Build
      working-directory: ./frontend
      run: npm run build

    - name: Cache Next.js build artifacts
      uses: actions/cache@v4
      with:
        path: |
          frontend/.next
          frontend/.next/cache
        key: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/next.config.*', 'frontend/tsconfig.json', 'frontend/src/**', 'frontend/tests/**') }}

    - name: Frontend performance budgets
      run: node ./scripts/check-frontend-performance-budgets.mjs

    - name: Contract discipline
      run: node ./scripts/check-contract-discipline.mjs

    - name: Journey blueprint discipline
      run: node ./scripts/check-user-journeys-blueprint.mjs

    - name: Journey provider-safe discipline
      run: node ./scripts/check-provider-safe-journey-catalogs.mjs

    - name: Journey bucket mapping discipline
      run: node ./scripts/check-journey-catalog-mapping.mjs

  critical-browser-e2e:
    name: Critical Browser E2E
    runs-on: ubuntu-latest
    needs: lint-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Restore Next.js build artifacts cache
      uses: actions/cache@v4
      with:
        path: |
          frontend/.next
          frontend/.next/cache
        key: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/next.config.*', 'frontend/tsconfig.json', 'frontend/src/**', 'frontend/tests/**') }}

    - name: Build frontend if cache is cold
      working-directory: ./frontend
      run: |
        if [ ! -f .next/BUILD_ID ]; then
          npm run build
        fi

    - name: Install Playwright browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run critical browser commerce journey
      working-directory: ./frontend
      env:
        PW_DISABLE_ARTIFACTS: "1"
        IS_STOREFRONT_READY: "1"
        NEXTAUTH_SECRET: ci-test-nextauth-secret-at-least-32-chars
        AUTH_SECRET: ci-test-nextauth-secret-at-least-32-chars
        NEXTAUTH_URL: http://127.0.0.1:3000
        RUN_LIVE_PROVIDER_JOURNEYS: "0"
      run: npm run test:e2e:critical

  journey-e2e:
    name: Journey E2E (Shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    needs: lint-build
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]
        shard_total: [4]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: SUDATTAS
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend -> target

    - name: Make backend binaries executable
      run: |
        chmod +x backend/scripts/wait_for_http_ready.sh

    - name: Install protobuf compiler and redis-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev redis-tools
        protoc --version

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Restore Next.js build artifacts cache
      uses: actions/cache@v4
      with:
        path: |
          frontend/.next
          frontend/.next/cache
        key: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/next.config.*', 'frontend/tsconfig.json', 'frontend/src/**', 'frontend/tests/**') }}

    - name: Setup backend test database schema
      run: |
        sleep 10
        mysql -h 127.0.0.1 -P 3306 -u root -ptest_password -e "CREATE DATABASE IF NOT EXISTS SUDATTAS;"
        mysql -h 127.0.0.1 -P 3306 -u root -ptest_password < backend/database/sql_dump/01_schema.sql
        chmod +x ./backend/scripts/apply_sql_migrations.sh
        ./backend/scripts/apply_sql_migrations.sh 127.0.0.1 3306 root test_password SUDATTAS ./backend/database/migrations
        MISSING_TABLES="$(mysql -N -s -h 127.0.0.1 -P 3306 -u root -ptest_password -e "
          SELECT required.required_name
          FROM (
            SELECT 'refundattempts' AS required_name
            UNION ALL SELECT 'returnrequests'
            UNION ALL SELECT 'returnrequestitems'
            UNION ALL SELECT 'orderinventoryrestores'
            UNION ALL SELECT 'orderinventoryrestoreitems'
            UNION ALL SELECT 'invoices'
            UNION ALL SELECT 'schemamigrations'
          ) AS required
          LEFT JOIN (
            SELECT DISTINCT LOWER(REPLACE(table_name, '_', '')) AS normalized_name
            FROM information_schema.tables
            WHERE table_schema = 'SUDATTAS'
          ) AS existing
          ON required.required_name = existing.normalized_name
          WHERE existing.normalized_name IS NULL;
        ")"
        if [[ -n "$MISSING_TABLES" ]]; then
          echo "Missing required tables before backend startup:"
          echo "$MISSING_TABLES"
          echo "Existing SUDATTAS tables:"
          mysql -N -s -h 127.0.0.1 -P 3306 -u root -ptest_password -e \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='SUDATTAS' ORDER BY table_name;"
          exit 1
        fi
        echo "Backend schema sanity check passed for frontend smoke CI."

    - name: Build backend binaries
      working-directory: ./backend
      run: cargo build -p core_operations -p graphql --all-features

    - name: Install Playwright browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Start backend and run Playwright journey scenarios
      env:
        APP_ENV: test
        STRICT_STARTUP_VALIDATION: "false"
        IS_STOREFRONT_READY: "1"
        DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/SUDATTAS
        REDIS_URL: redis://127.0.0.1:6379
        GRPC_SERVER: 0.0.0.0:50051
        GRPC_URL: http://127.0.0.1:50051
        GRPC_AUTH_TOKEN: ci-test-grpc-token
        GRAPHQL_URL: http://127.0.0.1:8080/v2
        NEXT_PUBLIC_GRAPHQL_URL: http://127.0.0.1:8080/v2
        ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
        REQUIRE_WEBHOOK_SECRETS: "false"
        OAUTH_DOMAIN: https://accounts.google.com/
        OAUTH_AUDIENCE: https://www.googleapis.com/oauth2/v3/tokeninfo
        INTERNAL_API_SECRET: ci-test-internal-secret
        AUTH_SECRET: ci-test-nextauth-secret-at-least-32-chars
        NEXTAUTH_SECRET: ci-test-nextauth-secret-at-least-32-chars
        ADMIN_ALLOWED_EMAILS: admin@example.com
        NEXTAUTH_URL: http://127.0.0.1:3000
        PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard_index }}
        PLAYWRIGHT_SHARD_TOTAL: ${{ matrix.shard_total }}
        PW_DISABLE_ARTIFACTS: "1"
        RUN_LIVE_PROVIDER_JOURNEYS: "0"
      run: |
        set -euo pipefail
        mkdir -p /tmp/backend-logs
        CORE_LOG=/tmp/backend-logs/core_operations.log
        GRAPHQL_LOG=/tmp/backend-logs/graphql.log
        FRONTEND_LOG=/tmp/backend-logs/frontend.log

        ./backend/target/debug/core_operations > "$CORE_LOG" 2>&1 &
        CORE_PID=$!
        ./backend/target/debug/graphql > "$GRAPHQL_LOG" 2>&1 &
        GRAPHQL_PID=$!
        (
          cd frontend
          PORT=3000 npm run start > "$FRONTEND_LOG" 2>&1
        ) &
        FRONTEND_PID=$!

        dump_service_logs() {
          echo "========== core_operations log (last 200 lines) =========="
          tail -n 200 "$CORE_LOG" || true
          echo "========== graphql log (last 200 lines) =========="
          tail -n 200 "$GRAPHQL_LOG" || true
          echo "========== frontend log (last 200 lines) =========="
          tail -n 200 "$FRONTEND_LOG" || true
        }

        ensure_process_alive() {
          local pid="$1"
          local name="$2"
          local log_file="$3"
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "${name} exited before readiness completed"
            tail -n 200 "$log_file" || true
            dump_service_logs
            exit 1
          fi
        }

        wait_for_ready_with_process_guard() {
          local url="$1"
          local max_attempts="${2:-90}"
          local sleep_seconds="${3:-3}"
          echo "Waiting for readiness endpoint: ${url}"
          for i in $(seq 1 "$max_attempts"); do
            if curl -sf "$url" > /dev/null 2>&1; then
              echo "Ready: ${url}"
              return 0
            fi
            ensure_process_alive "$CORE_PID" "core_operations" "$CORE_LOG"
            ensure_process_alive "$GRAPHQL_PID" "graphql" "$GRAPHQL_LOG"
            ensure_process_alive "$FRONTEND_PID" "frontend" "$FRONTEND_LOG"
            sleep "$sleep_seconds"
          done
          echo "Readiness check failed after ${max_attempts} attempts: ${url}"
          dump_service_logs
          return 1
        }

        cleanup() {
          kill "$CORE_PID" "$GRAPHQL_PID" "$FRONTEND_PID" 2>/dev/null || true
        }
        trap cleanup EXIT

        # Fail fast if either background process exits immediately.
        sleep 3
        if ! kill -0 "$CORE_PID" 2>/dev/null; then
          echo "core_operations failed to start"
          dump_service_logs
          exit 1
        fi
        if ! kill -0 "$GRAPHQL_PID" 2>/dev/null; then
          echo "graphql failed to start"
          dump_service_logs
          exit 1
        fi
        if ! kill -0 "$FRONTEND_PID" 2>/dev/null; then
          echo "frontend failed to start"
          dump_service_logs
          exit 1
        fi

        wait_for_ready_with_process_guard http://127.0.0.1:8080/ready 90 3
        wait_for_ready_with_process_guard http://127.0.0.1:3000 90 3
        echo "Running Playwright shard ${PLAYWRIGHT_SHARD_INDEX}/${PLAYWRIGHT_SHARD_TOTAL}"
        (
          cd frontend
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 PLAYWRIGHT_REUSE_EXISTING_SERVER=1 npx playwright test tests/e2e/journey-paths.spec.ts --shard=${PLAYWRIGHT_SHARD_INDEX}/${PLAYWRIGHT_SHARD_TOTAL} --reporter=line
        )
