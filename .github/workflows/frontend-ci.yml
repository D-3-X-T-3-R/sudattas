name: Frontend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint -- --max-warnings=0

    - name: Unit Tests
      working-directory: ./frontend
      run: npm run test

    - name: Build
      working-directory: ./frontend
      run: npm run build

    - name: Frontend performance budgets
      run: node ./scripts/check-frontend-performance-budgets.mjs

    - name: Contract discipline
      run: node ./scripts/check-contract-discipline.mjs
