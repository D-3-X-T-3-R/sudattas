name: Backend CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Matches backend/rust-toolchain.toml — no nightly-only feature is used anywhere
  # in this workspace (verified: `cargo check --workspace --all-targets --all-features`
  # passes on stable), so lint/test/security jobs no longer depend on nightly's
  # availability. The `build` job below still separately checks a nightly matrix
  # entry as a forward-compatibility signal.
  RUST_TOOLCHAIN: 1.93.1

jobs:
  # ============================================================================
  # Job 0: Public Env Safety
  # ============================================================================
  public-env-safety:
    name: Public Env Safety
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify no privileged NEXT_PUBLIC env vars are exposed
      run: bash ./scripts/check-no-privileged-public-env.sh

  # ============================================================================
  # Job 1: Lint and Format Check
  # ============================================================================
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: backend/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version

    - name: Check formatting
      working-directory: ./backend
      run: cargo fmt --all -- --check

    - name: Clippy
      working-directory: ./backend
      run: cargo clippy --all-targets --all-features -- -D warnings

  # ============================================================================
  # Job 2: Build and Test (split for parallelism)
  # ============================================================================
  test-schema-entities:
    name: Schema & Entities
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: sudattas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev
        protoc --version

    - name: Setup test database
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: test_password
      run: |
        # Wait for MySQL to be ready
        sleep 10
        # 01_schema.sql is the single source of truth; creates and uses database SUDATTAS
        mysql -h 127.0.0.1 -P 3306 -u root -ptest_password < backend/database/sql_dump/01_schema.sql
        echo "Database schema loaded successfully"
        chmod +x ./backend/scripts/apply_sql_migrations.sh
        ./backend/scripts/apply_sql_migrations.sh 127.0.0.1 3306 root test_password SUDATTAS ./backend/database/migrations --verify-idempotent

    - name: Regenerate entities and verify
      env:
        RUSTFLAGS: ""
        RUSTDOCFLAGS: ""
        CARGO_ENCODED_RUSTFLAGS: ""
      run: |
        unset RUSTFLAGS RUSTDOCFLAGS CARGO_ENCODED_RUSTFLAGS
        cargo install sea-orm-cli --version 1.1.20 --locked
        sea-orm-cli generate entity \
          -u "mysql://root:test_password@127.0.0.1:3306/SUDATTAS" \
          -o backend/core_db_entities/src/entity \
          --with-serde both \
          --date-time-crate chrono \
          --max-connections 1
        if ! git diff --exit-code backend/core_db_entities/src/entity; then
          echo "::error::Entity files are out of sync with schema. Run: cargo install sea-orm-cli --version 1.1.20 --locked && sea-orm-cli generate entity -u 'mysql://root:test_password@127.0.0.1:3306/SUDATTAS' -o backend/core_db_entities/src/entity --with-serde both --date-time-crate chrono --max-connections 1"
          exit 1
        fi

  test-unit-doc:
    name: Unit & Doc Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev
        protoc --version

    - name: Run unit tests
      working-directory: ./backend
      run: cargo test --lib --bins --tests --all-features --no-fail-fast -- --skip ignored

    - name: Run doc tests
      working-directory: ./backend
      run: cargo test --doc --all-features

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: sudattas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev
        protoc --version

    - name: Setup test database
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: test_password
      run: |
        # Wait for MySQL to be ready
        sleep 10
        mysql -h 127.0.0.1 -P 3306 -u root -ptest_password < backend/database/sql_dump/01_schema.sql
        echo "Database schema loaded successfully"
        chmod +x ./backend/scripts/apply_sql_migrations.sh
        ./backend/scripts/apply_sql_migrations.sh 127.0.0.1 3306 root test_password SUDATTAS ./backend/database/migrations

    - name: Run integration tests
      working-directory: ./backend
      env:
        TEST_DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/SUDATTAS
        FREE_SHIPPING_THRESHOLD_MINOR: "100000"
        RUN_LIVE_LOGISTICS_TESTS: "0"
        # For payment verification tests (optional; tests set their own for P2/P3)
        RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      run: |
        # Note: integration_logistics_live is intentionally excluded — per its own
        # doc comment it creates a real Shiprocket order and cancels it before exit.
        # It's gated behind RUN_LIVE_LOGISTICS_TESTS=1 (set to "0" above) so it
        # wouldn't run today regardless, but it's left out of CI entirely so a
        # future config change here can't accidentally start hitting the real
        # Shiprocket API. razorpay_connectivity is safe to keep: it points
        # RAZORPAY_API_BASE at a local mock server and never calls the real API.
        for test_binary in integration_abandoned_cart_outbox integration_cart integration_coupons integration_order_state integration_payments integration_products integration_refunds integration_reviews integration_shipping integration_users integration_users_carts_orders_products integration_webhooks integration_wishlist integration_launch_concurrency integration_place_order_atomicity integration_returns integration_invoices integration_coupon_redemption_consistency integration_logistics_fulfillment integration_selected_checkout razorpay_connectivity schema_validation; do
          cargo test -p core_operations --test "$test_binary" --all-features --no-fail-fast -- --ignored --test-threads=1
        done
        for test_binary in handler_outbox handler_p2 handler_refunds_resolve handler_security; do
          cargo test -p core_operations --test "$test_binary" --all-features --no-fail-fast -- --ignored --test-threads=1
        done

  test-e2e-graphql:
    name: E2E GraphQL Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: sudattas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev
        protoc --version

    - name: Install redis-tools
      run: sudo apt-get install -y redis-tools

    - name: Setup test database
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: test_password
      run: |
        sleep 10
        mysql -h 127.0.0.1 -P 3306 -u root -ptest_password < backend/database/sql_dump/01_schema.sql
        echo "Database schema loaded"
        chmod +x ./backend/scripts/apply_sql_migrations.sh
        ./backend/scripts/apply_sql_migrations.sh 127.0.0.1 3306 root test_password SUDATTAS ./backend/database/migrations

    - name: Build E2E binaries
      working-directory: ./backend
      run: cargo build -p core_operations -p graphql --all-features

    - name: Start servers and run E2E GraphQL tests
      working-directory: ./backend
      env:
        DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/SUDATTAS
        GRPC_SERVER: 0.0.0.0:50051
        GRPC_URL: http://127.0.0.1:50051
        REDIS_URL: redis://127.0.0.1:6379
        OAUTH_DOMAIN: https://accounts.google.com/
        OAUTH_AUDIENCE: https://www.googleapis.com/oauth2/v3/tokeninfo
        ALLOWED_ORIGINS: https://app.sudattas.local
        GRAPHQL_URL: http://127.0.0.1:8080
        RATE_LIMIT_PER_MINUTE: "2000"
        INTERNAL_API_SECRET: ci-e2e-internal-secret
        GRAPHQL_E2E_CUSTOMER_USER_ID: "9002"
        GRAPHQL_E2E_ADMIN_USER_ID: "9001"
        ADMIN_ALLOWED_USER_IDS: "9001"
      timeout-minutes: 8
      run: |
        ./target/debug/core_operations &
        sleep 5
        ./target/debug/graphql &
        chmod +x ./scripts/wait_for_http_ready.sh
        ./scripts/wait_for_http_ready.sh http://127.0.0.1:8080/ready 60 3
        SESSION_JSON="$(curl -fsS -X POST http://127.0.0.1:8080/session/guest)"
        GRAPHQL_SESSION_ID="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get("session_id",""))' <<< "$SESSION_JSON")"
        if [[ -z "$GRAPHQL_SESSION_ID" ]]; then
          echo "Failed to create guest session from /session/guest"
          echo "Response: $SESSION_JSON"
          exit 1
        fi
        export GRAPHQL_SESSION_ID
        echo "Created guest session for session-path E2E tests"
        set +e
        cargo test -p graphql --test e2e_tests --all-features -- --ignored
        E2E_TESTS_STATUS=$?
        cargo test -p core_operations --lib --all-features -- --ignored --test-threads=1 test_session_lifecycle
        SESSION_STATUS=$?
        unset GRAPHQL_SESSION_ID
        cargo test -p graphql --test e2e_all_graphql_operations --all-features -- --ignored
        E2E_ALL_STATUS=$?
        cargo test -p graphql --test e2e_business_flows --all-features -- --ignored
        E2E_FLOWS_STATUS=$?
        set -e
        if [[ $E2E_TESTS_STATUS -ne 0 || $E2E_ALL_STATUS -ne 0 || $E2E_FLOWS_STATUS -ne 0 || $SESSION_STATUS -ne 0 ]]; then
          echo "One or more E2E/ignored suites failed."
          echo "e2e_tests=$E2E_TESTS_STATUS e2e_all_graphql_operations=$E2E_ALL_STATUS e2e_business_flows=$E2E_FLOWS_STATUS session_lifecycle=$SESSION_STATUS"
          exit 1
        fi

  # Aggregate test status so downstream jobs can keep `needs: test`
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [test-schema-entities, test-unit-doc, test-integration, test-e2e-graphql]

    steps:
    - name: Aggregate test status
      run: echo "All test sub-jobs passed"

  # ============================================================================
  # Job 3: Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      working-directory: ./backend
      run: cargo audit

  # ============================================================================
  # Job 5: Build Check (Ensure it compiles)
  # ============================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        rust: [stable, nightly]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build all packages
      working-directory: ./backend
      run: cargo build --all-features --verbose

    - name: Build release mode
      working-directory: ./backend
      run: cargo build --release --all-features

  # ============================================================================
  # Job 6: Check Dependencies
  # ============================================================================
  dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Install cargo-outdated
      run: cargo install cargo-outdated

    - name: Check for outdated dependencies
      working-directory: ./backend
      run: cargo outdated --exit-code 1 || true

  # ============================================================================
  # Summary Job - Required for branch protection
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [public-env-safety, lint, test, security, build]
    if: always()
    
    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ needs.lint.result }}" != "success" ]]; then
          echo "Lint job failed"
          exit 1
        fi
        if [[ "${{ needs.public-env-safety.result }}" != "success" ]]; then
          echo "Public env safety job failed"
          exit 1
        fi
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "Test job failed"
          exit 1
        fi
        if [[ "${{ needs.security.result }}" != "success" ]]; then
          echo "Security job failed"
          exit 1
        fi
        if [[ "${{ needs.build.result }}" != "success" ]]; then
          echo "Build job failed"
          exit 1
        fi
        echo "All required jobs passed! ✅"
