
syntax = "proto3";

package grpc_services;

// Cart (variant-based: schema Cart uses VariantID)

message CreateCartItemRequest {
    optional int64 user_id = 1;
    int64 variant_id = 2;
    int64 quantity = 3;
    optional string session_id = 4;  // Guest cart when user_id not set
}

message GetCartItemsRequest {
    optional int64 user_id = 1;
    optional string session_id = 2;  // Guest cart; use when user_id not set
}

message UpdateCartItemRequest {
    int64 cart_id = 1;
    optional int64 user_id = 2;
    int64 variant_id = 3;
    int64 quantity = 4;
    optional string session_id = 5;
}

message DeleteCartItemRequest {
    optional int64 user_id = 1;
    optional int64 cart_id = 2;
    optional string session_id = 3;
}

message CartItemResponse {
    int64 cart_id = 1;
    int64 user_id = 2;
    int64 variant_id = 3;
    int64 quantity = 4;
}

message CartItemsResponse {
    repeated CartItemResponse items = 1;
}

// Merges a guest (session-scoped) cart into an authenticated user's cart, e.g.
// right after login. Rows for a variant already in the user's cart have their
// quantities summed; rows for a new variant are reassigned to the user.
// Returns the user's cart after merging.
message MergeCartRequest {
    int64 user_id = 1;
    string session_id = 2;
}

// ShippingAddress (flattened: no country/state/city lookup; schema has UserID, RecipientName, Country, StateRegion, City, PostalCode, Road, ApartmentNoOrName)

message CreateShippingAddressRequest {
    optional int64 user_id = 1;
    bool is_default = 2;
    string country = 3;
    string state_region = 4;
    string city = 5;
    string postal_code = 6;
    optional string road = 7;
    optional string apartment_no_or_name = 8;
    optional string recipient_name = 9;
    optional string phone_number = 10;
}

message UpdateShippingAddressRequest {
    int64 shipping_address_id = 1;
    optional int64 user_id = 2;
    bool is_default = 3;
    string country = 4;
    string state_region = 5;
    string city = 6;
    string postal_code = 7;
    optional string road = 8;
    optional string apartment_no_or_name = 9;
    optional string recipient_name = 10;
    optional string phone_number = 11;
}

message DeleteShippingAddressRequest {
    int64 shipping_address_id = 1;
}

message GetShippingAddressRequest { }

message ShippingAddressResponse {
    int64 shipping_address_id = 1;
    optional int64 user_id = 2;
    bool is_default = 3;
    string country = 4;
    string state_region = 5;
    string city = 6;
    string postal_code = 7;
    optional string road = 8;
    optional string apartment_no_or_name = 9;
    optional string recipient_name = 10;
    optional string phone_number = 11;
}

message ShippingAddressesResponse {
    repeated ShippingAddressResponse items = 1;
}

// Products (schema: no StockQuantity; CategoryID required; inventory per variant)

message CreateProductRequest {
    string name = 1;
    optional string description = 2;
    int64 price_paise = 3;  // Price in minor units (e.g. 49900 = ₹499.00)
    int64 category_id = 4;   // Required; schema ProductCategories
    optional string sku = 5;
    optional string slug = 6;
    optional string fabric = 7;
    optional string weave = 8;
    optional string occasion = 9;
    optional bool has_blouse_piece = 10;
    optional string care_instructions = 11;
    optional int64 product_status_id = 12;
}

message SearchProductRequest {
    optional string name = 1;
    optional string description = 2;
    optional int64 starting_price_paise = 3;
    optional int64 category_id = 4;
    optional int64 ending_price_paise = 5;
    optional int64 product_id = 6;
    optional int64 limit = 7;
    optional int64 offset = 8;
    optional string fabric = 9;
    optional string weave = 10;
    optional string occasion = 11;
    optional int64 product_status_id = 12;
    optional int64 mood_id = 13;  // filter products that have this mood linked
}

message GetProductsByIdRequest {
    repeated int64 product_ids = 1;
}

message UpdateProductRequest {
    string name = 1;
    optional string description = 2;
    int64 price_paise = 3;
    int64 category_id = 4;
    int64 product_id = 5;
    optional string sku = 6;
    optional string slug = 7;
    optional string fabric = 8;
    optional string weave = 9;
    optional string occasion = 10;
    optional bool has_blouse_piece = 11;
    optional string care_instructions = 12;
    optional int64 product_status_id = 13;
}

message DeleteProductRequest {
    int64 product_id = 1;
}

message ProductResponse {
    string name = 1;
    optional string description = 2;
    int64 price_paise = 3;
    int64 category_id = 4;
    int64 product_id = 5;
    optional string sku = 6;
    optional string slug = 7;
    optional string fabric = 8;
    optional string weave = 9;
    optional string occasion = 10;
    optional bool has_blouse_piece = 11;
    optional string care_instructions = 12;
    optional int64 product_status_id = 13;
}

message ProductsResponse {
    repeated ProductResponse items = 1;
}

// Users
// auth_provider = "email" → password_plain required, google_sub omitted
// auth_provider = "google" → google_sub required, password_plain omitted

message CreateUserRequest {
    string username = 1;
    string email = 2;
    string auth_provider = 3;            // "email" | "google"
    optional string password_plain = 4;  // Required when auth_provider="email"; server hashes; never returned
    optional string google_sub = 5;      // Required when auth_provider="google"; stable Google sub claim
    optional string full_name = 6;
    optional string address = 7;
    optional string phone = 8;
    optional int64 role_id = 9;
}

message SearchUserRequest {
    optional int64 user_id = 1;
    optional string username = 2;
    optional string email = 3;
    optional string auth_provider = 4;  // "email" | "google"
    optional string google_sub = 5;
    optional string full_name = 6;
    optional string address = 7;
    optional string phone = 8;
    optional int64 role_id = 9;
    optional int64 user_status_id = 10;
    optional int64 limit = 11;
    optional int64 offset = 12;
}

message UpdateUserRequest {
    int64 user_id = 1;
    optional string username = 2;
    optional string email = 3;
    optional string password_plain = 4;  // If set, updates password_hash (email accounts only)
    optional string google_sub = 5;      // If set, updates google_sub (google accounts only)
    optional string full_name = 6;
    optional string address = 7;
    optional string phone = 8;
    optional int64 role_id = 9;
    optional string first_name = 10;
    optional string last_name = 11;
    optional string gender = 12;         // "male" | "female" | "other"
    optional string date_of_birth = 13;  // ISO yyyy-mm-dd
}

message DeleteUserRequest {
    int64 user_id = 1;
}

message UserResponse {
    int64 user_id = 1;
    string username = 2;
    string email = 3;
    string auth_provider = 4;            // "email" | "google"
    optional string full_name = 5;
    optional string address = 6;
    optional string phone = 7;
    string create_date = 8;
    optional string session_id = 9;      // Set on create_user when Redis session is created
    optional int64 role_id = 10;
    optional int64 user_status_id = 11;
    optional string first_name = 12;
    optional string last_name = 13;
    optional string gender = 14;         // "male" | "female" | "other"
    optional string date_of_birth = 15;  // ISO yyyy-mm-dd
}

message UsersResponse {
    repeated UserResponse items = 1;
}

// P2 Security: audit log for secrets rotation etc.
message RecordSecurityAuditRequest {
    string event_type = 1;  // e.g. secrets_rotation, config_reload
    optional string details = 2;
}
message RecordSecurityAuditResponse {
    bool success = 1;
}

// P2 Data retention: export PII for the user (no password); caller must be self or admin.
message GetUserPiiExportRequest {
    int64 user_id = 1;
}
message GetUserPiiExportResponse {
    int64 user_id = 1;
    string email = 2;
    optional string full_name = 3;
    optional string address = 4;
    optional string phone = 5;
    string create_date = 6;
    optional string first_name = 7;
    optional string last_name = 8;
    optional string gender = 9;          // "male" | "female" | "other"
    optional string date_of_birth = 10;  // ISO yyyy-mm-dd
}

// Categories

message CreateCategoryRequest {
    string name = 1;
}

message SearchCategoryRequest {
    optional int64 category_id = 1;
    optional string name = 2;
}

message UpdateCategoryRequest {
    int64 category_id = 1;
    string name = 2;
}

message DeleteCategoryRequest {
    int64 category_id = 1;
}

message CategoryResponse {
    int64 category_id = 1;
    string name = 2;
}

message CategoriesResponse {
    repeated CategoryResponse items = 1;
}

// Orders

message PlaceOrderRequest{
    int64 shipping_address_id = 1;
    int64 user_id = 2;
    optional string coupon_code = 3;
    repeated int64 selected_cart_ids = 4;
    // "prepaid" (default) or "cod"
    optional string payment_mode = 5;
}

// Checkout shipping estimate for bag/checkout preview (no order mutation).
message EstimateCheckoutShippingRequest {
    int64 shipping_address_id = 1;
    int64 user_id = 2;
    optional string coupon_code = 3;
    repeated int64 selected_cart_ids = 4;
}

message EstimateCheckoutShippingResponse {
    int64 shipping_amount_paise = 1;
    optional string courier_name = 2;
    optional int32 estimated_delivery_days = 3;
    int64 item_subtotal_paise = 4;
    int64 order_total_paise = 5;
    bool quote_available = 6;
    optional string note = 7;
}
message CreateOrderRequest {
    int64 user_id = 1;
    int64 shipping_address_id = 2;
    int64 status_id = 3;
    int64 total_amount_paise = 4;  // Legacy total in paise; prefer grand_total_minor when set
    optional int64 subtotal_minor = 5;
    optional int64 shipping_minor = 6;
    optional int64 tax_total_minor = 7;
    optional int64 discount_total_minor = 8;
    optional int64 grand_total_minor = 9;
    optional int64 applied_coupon_id = 10;
    optional string applied_coupon_code = 11;
    optional int32 applied_discount_paise = 12;
    // "cod" | "prepaid". Required so the order can ever become bookable for shipping (the same
    // eligibility gate real checkout orders go through checks this). "prepaid" here means payment
    // was already collected outside this system (cash/UPI/bank transfer) — the caller is
    // asserting that happened, not triggering a live payment flow; it is recorded as captured
    // immediately.
    string payment_method = 13;
}

// Admin: place a full order on a customer's behalf (phone/in-person sale, etc.) in one atomic
// call — order + line items + immediate confirmation, mirroring the same order_state_machine
// transition, invoice generation, and order_event that real COD checkout produces. Unlike real
// checkout, there is never a live Razorpay step here: both "cod" and "prepaid" are treated as
// already settled the instant the admin places the order — "prepaid" only records that payment
// happened outside this system, it does not trigger collecting it.
message PlaceOrderAdminLineItem {
    int64 variant_id = 1;
    int64 quantity = 2;
    int64 price_paise = 3;  // Line total (unit price x quantity), matching CreateOrderDetailRequest
}

message PlaceOrderAdminRequest {
    int64 user_id = 1;
    int64 shipping_address_id = 2;
    string payment_method = 3;  // "cod" | "prepaid"
    repeated PlaceOrderAdminLineItem line_items = 4;
    optional int64 shipping_minor = 5;
    optional int64 applied_coupon_id = 6;
    optional string applied_coupon_code = 7;
    optional int32 applied_discount_paise = 8;
}

message SearchOrderRequest {
    optional int64 order_id = 1;
    optional int64 user_id = 2;  // when unset, admin search (all orders)
    optional int64 order_date_start = 3;
    optional int64 order_date_end = 4;
    optional int64 status_id = 5;
    optional int64 limit = 6;
    optional int64 offset = 7;
}

message UpdateOrderRequest {
    int64 order_id = 1;
    int64 user_id = 2;
    int64 shipping_address_id = 3;
    int64 total_amount_paise = 4;
    int64 status_id = 5;
}

message DeleteOrderRequest {
  int64 order_id = 1;
  // When set, the order must belong to this user (customer self-cancel). Omit for trusted admin/service.
  optional int64 acting_user_id = 2;
}

message CancelOrderItemsRequest {
  int64 order_id = 1;
  repeated int64 order_detail_ids = 2;
  // Same ownership semantics as DeleteOrderRequest.
  optional int64 acting_user_id = 3;
}

message ReturnRequestItemInput {
    int64 order_detail_id = 1;
    optional int64 quantity = 2;
}

message RequestReturnRequest {
    int64 order_id = 1;
    int64 user_id = 2;
    repeated ReturnRequestItemInput items = 3;
    string reason = 4;
}

message SearchReturnRequestsRequest {
    optional int64 return_id = 1;
    optional int64 order_id = 2;
    optional int64 user_id = 3;
}

message AdminMarkReturnReceivedRequest {
    int64 return_id = 1;
}

message AdminUpdateReturnStatusRequest {
    int64 return_id = 1;
    string status = 2;
    optional string note = 3;
}

message ReturnRequestItemResponse {
    int64 return_id = 1;
    int64 order_detail_id = 2;
    int64 quantity = 3;
    int64 refund_amount_minor = 4;
    string status = 5;
}

message ReturnRequestResponse {
    int64 return_id = 1;
    int64 order_id = 2;
    int64 user_id = 3;
    string status = 4;
    string reason = 5;
    string created_at = 6;
    optional string received_at = 7;
    optional int64 refund_attempt_id = 8;
    repeated ReturnRequestItemResponse items = 9;
}

message ReturnRequestsResponse {
    repeated ReturnRequestResponse items = 1;
}

// P1 Admin: mark order shipped/delivered with enforced transitions
message AdminMarkOrderShippedRequest {
    int64 order_id = 1;
    optional string awb_code = 2;
    optional string carrier = 3;
    // When true, core_operations calls Shiprocket (create adhoc + assign AWB) and fills awb/carrier/shiprocket_order_id before persisting.
    optional bool shiprocket_book = 4;
    // Set by server when shiprocket_book succeeds; optional manual override if shiprocket_book is false.
    optional string shiprocket_order_id = 5;
    // Filled by server after Shiprocket booking (assign AWB response); optional echo for downstream shipment row.
    optional int32 shiprocket_status_id = 6;
    optional string shiprocket_status_label = 7;
}
message AdminMarkOrderShippedResponse {
    int64 order_id = 1;
    int64 shipment_id = 2;  // 0 if none created
}

message AdminMarkOrderDeliveredRequest {
    int64 order_id = 1;
}
message AdminMarkOrderDeliveredResponse {
    int64 order_id = 1;
}

message UpdatePickupTargetRequest {
    int64 order_id = 1;
    string pickup_target_at = 2; // RFC3339
    optional string reason = 3;
    optional string actor_id = 4;
}

message UpdatePickupTargetResponse {
    int64 order_id = 1;
    string pickup_target_at = 2; // RFC3339
    optional string pickup_target_reason = 3;
    optional string pickup_target_set_by = 4;
    string pickup_target_updated_at = 5; // RFC3339
}

message OrderResponse {
    int64 order_id = 1;
    int64 user_id = 2;
    string order_date = 3;
    int64 shipping_address_id = 4;
    int64 total_amount_paise = 5;
    int64 status_id = 6;
    // Immutable provider-safe reference (e.g. Shiprocket order_id); never reuse numeric order_id alone.
    string public_order_ref = 7;
    // Durable settlement snapshot: refund_pending | refund_processed | refund_failed | refund_not_applicable
    optional string refund_settlement_status = 8;
    // "prepaid" | "cod" (nullable for historical rows)
    optional string payment_method = 9;
    optional string cancel_window_ends_at = 10;
    optional string earliest_booking_at = 11;
    optional string pickup_target_at = 12;
    optional string fulfillment_status = 13;
    optional int64 invoice_id = 14;
    optional string invoice_number = 15;
    optional string invoice_generated_at = 16;
    optional string invoice_storage_path = 17;
    optional bool invoice_available = 18;
}

message OrdersResponse {
    repeated OrderResponse items = 1;
}

message GetOrderInvoiceRequest {
    int64 order_id = 1;
}

message InvoiceResponse {
    int64 invoice_id = 1;
    string invoice_number = 2;
    int64 order_id = 3;
    int64 user_id = 4;
    string generated_at = 5;
    string storage_path = 6;
}

message GetOrderInvoiceDownloadRequest {
    int64 order_id = 1;
}

message GetOrderInvoiceDownloadResponse {
    InvoiceResponse invoice = 1;
    bytes pdf_bytes = 2;
    string file_name = 3;
    string content_type = 4;
}

// OrderStatus (list for admin dropdowns; table OrderStatus)
message SearchOrderStatusRequest {}
message OrderStatusResponse {
    int64 status_id = 1;
    string status_name = 2;
}
message OrderStatusesResponse {
    repeated OrderStatusResponse items = 1;
}

// OrderDetails (schema: VariantID not ProductID)

message CreateOrderDetailRequest {
    int64 order_id = 1;
    int64 variant_id = 2;
    int64 quantity = 3;
    int64 price_paise = 4;
    optional int32 unit_price_minor = 5;
    optional int32 discount_minor = 6;
    optional int32 tax_minor = 7;
    optional string sku = 8;
    optional string title = 9;
}

message CreateOrderDetailsRequest {
    repeated CreateOrderDetailRequest order_details = 1;
}

message SearchOrderDetailRequest {
    optional int64 order_detail_id = 1;
    optional int64 order_id = 2;
    optional int64 variant_id = 3;
    optional int64 quantity = 4;
    optional int64 price_start_paise = 5;
    optional int64 price_end_paise = 6;
}

message UpdateOrderDetailRequest {
    int64 order_detail_id = 1;
    int64 order_id = 2;
    int64 variant_id = 3;
    int64 quantity = 4;
    int64 price_paise = 5;
}

message OrderDetailResponse {
    int64 order_detail_id = 1;
    int64 order_id = 2;
    int64 variant_id = 3;
    int64 quantity = 4;
    int64 price_paise = 5;
    int64 line_total_minor = 6;
    string item_status = 7;
    optional string cancelled_at = 8;
}

message OrderDetailsResponse {
    repeated OrderDetailResponse items = 1;
}

// Reviews (schema: Rating TINYINT 1-5, UNIQUE(UserID, ProductID))

message CreateReviewRequest {
    int64 product_id = 1;
    int64 user_id = 2;
    int32 rating = 3;  // 1-5
    string comment = 4;
}

message SearchReviewRequest {
    int64 review_id = 1;
    optional int64 product_id = 2;
    optional int64 user_id = 3;
    optional int64 limit = 4;
    optional int64 offset = 5;
    optional string status_filter = 6;  // P2: "approved" | "pending" | "rejected" (default: all)
}

message UpdateReviewRequest {
    int64 review_id = 1;
    optional int64 product_id = 2;
    optional int64 user_id = 3;
    optional int32 rating = 4;  // 1-5
    optional string comment = 5;
}

message DeleteReviewRequest {
    int64 review_id = 1;
}

message ReviewResponse {
    int64 review_id = 1;
    int64 product_id = 2;
    int64 user_id = 3;
    int32 rating = 4;  // 1-5
    string comment = 5;
    string review_status = 6;  // "pending" | "approved" | "rejected"
    bool is_verified_purchase = 7;
    string created_at = 8;  // RFC3339; empty if unset
}

message ReviewsResponse {
    repeated ReviewResponse items = 1;
}

// P2 Review moderation: admin approve/reject
message AdminUpdateReviewStatusRequest {
    int64 review_id = 1;
    string status = 2;  // "approved" | "rejected"
}
message AdminUpdateReviewStatusResponse {
    bool success = 1;
}

// Server-side rating aggregate for a product (real SQL AVG/COUNT instead of the caller fetching
// every review row and averaging client-side). average_rating is CEIL(AVG(Rating)), so e.g. 3.2
// and 3.8 both come back as 4; 0 when the product has no ratings yet.
message ProductRatingSummaryRequest {
    int64 product_id = 1;
}
message ProductRatingSummaryResponse {
    int64 product_id = 1;
    int32 average_rating = 2;  // ceil(AVG(Rating)), 0-5
    int64 rating_count = 3;
}

// P2 Abandoned cart: scheduler enqueues events (call periodically, e.g. every hour)
message EnqueueAbandonedCartRequest {
    optional int64 delay_hours = 1;  // carts older than this (default 24)
}
message EnqueueAbandonedCartResponse {
    int32 enqueued_count = 1;
}

// P2 Recommendations: manual related products
message GetRelatedProductsRequest {
    int64 product_id = 1;
    optional int64 limit = 2;
}

// P2 SEO: sitemap entries (slug + lastmod for products)
message GetSitemapProductUrlsRequest {
    optional int64 limit = 1;  // max entries (default 5000)
}
message SitemapEntry {
    string slug = 1;       // product slug for URL path
    string lastmod = 2;    // RFC3339 date
}
message GetSitemapProductUrlsResponse {
    repeated SitemapEntry entries = 1;
}

// ProductImages

message SearchProductImageRequest {
    optional int64 image_id = 1;
    optional int64 product_id = 2;
    optional string alt_text = 3;
}

message UpdateProductImageRequest {
    int64 image_id = 1;
    int64 product_id = 2;
    string image_base64 = 3;
    optional string alt_text = 4;
}

message DeleteProductImageRequest {
    int64 image_id = 1;
}

message ProductImageResponse {
    int64 image_id = 1;
    int64 product_id = 2;
    string image_base64 = 3;    // legacy; empty for R2-backed images
    optional string alt_text = 4;
    optional string url = 5;    // full CDN URL
    optional string cdn_path = 6;
    optional string thumbnail_url = 7;
}

message ProductImagesResponse {
    repeated ProductImageResponse items = 1;
}

message GetPresignedUploadUrlRequest {
    int64 product_id = 1;
    string filename = 2;
    string content_type = 3;
    optional int32 display_order = 4;  // When set, used as image index for key (avoids race when uploading multiple in parallel)
}

message PresignedUploadUrlResponse {
    string upload_url = 1;  // PUT this URL directly from the client
    string key = 2;         // R2 object key — pass back to ConfirmImageUpload
    string cdn_url = 3;     // final public URL after upload
}

message ConfirmImageUploadRequest {
    int64 product_id = 1;
    string key = 2;           // R2 object key (required when url is not set; used for new uploads)
    optional string alt_text = 3;
    optional int32 display_order = 4;
    optional string url = 5;  // when set, use this URL for this display_order (for re-adding existing images after delete)
}

// Sync product images: update display_order for kept, bulk insert new, delete removed (1 row per image).
message SyncProductImageItem {
    optional int64 image_id = 1;  // existing row to keep; set its display_order to index
    optional string key = 2;      // new upload; insert row with url built from key
    optional string url = 3;      // when key empty, use this url for new row
}
message SyncProductImagesRequest {
    int64 product_id = 1;
    repeated SyncProductImageItem items = 2;  // ordered list; index = display_order
}

// Inventory (schema: VariantID; no supplier)

message CreateInventoryItemRequest {
    int64 variant_id = 1;
    int64 quantity_available = 2;
    int64 reorder_level = 3;
}

message SearchInventoryItemRequest {
    optional int64 inventory_id = 1;
    optional int64 variant_id = 2;
}

message UpdateInventoryItemRequest {
    int64 inventory_id = 1;
    optional int64 variant_id = 2;
    optional int64 quantity_available = 3;
    optional int64 reorder_level = 4;
}

message DeleteInventoryItemRequest {
    int64 inventory_id = 1;
}

message InventoryItemResponse {
    int64 inventory_id = 1;
    int64 variant_id = 2;
    int64 quantity_available = 3;
    int64 reorder_level = 4;
}

message InventoryItemsResponse {
    repeated InventoryItemResponse items = 1;
}

// Wishlist

message AddWishlistItemRequest {
    int64 user_id = 1;
    int64 product_id = 2;
}

message SearchWishlistItemRequest {
    optional int64 wishlist_id = 1;
    int64 user_id = 2;
    optional int64 product_id = 3;

}

message DeleteWishlistItemRequest {
    int64 wishlist_id = 1;
    int64 user_id = 2;
}

message WishlistItemResponse {
    int64 wishlist_id = 1;
    int64 user_id = 2;
    int64 product_id = 3;
    string date_added = 4;
}

message WishlistItemsResponse {
    repeated WishlistItemResponse items = 1;
}

// ProductMoods (schema: lookup only; id + MoodName; link products via ProductMoodMapping)

message CreateProductMoodRequest {
    string mood_name = 1;
}

message SearchProductMoodRequest {
    optional int64 mood_id = 1;
    optional string mood_name = 2;
}

message UpdateProductMoodRequest {
    int64 mood_id = 1;
    optional string mood_name = 2;
}

message DeleteProductMoodRequest {
    int64 mood_id = 1;
}

message ProductMoodResponse {
    int64 mood_id = 1;
    string mood_name = 2;
}

message ProductMoodsResponse {
    repeated ProductMoodResponse items = 1;
}

// Storefront: distinct moods from the newest products (scan recent products, collect mood ids in order).
message ShopHighlightMoodsRequest {
    optional int64 recent_product_limit = 1; // products to scan, default 100, max 500
    optional int64 max_moods = 2;           // max moods to return, default 4, max 20
}

message ShopHighlightMoodItem {
    int64 mood_id = 1;
    string mood_name = 2;
