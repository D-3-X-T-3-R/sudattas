[package]
name = "graphql"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
juniper = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.25.0", features = ["derive", "strum_macros"] }
maplit = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
dotenvy = "0.15"
jsonwebtoken = "9.1.0"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
warp = { version = "0.4.3", features = ["server", "test"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
proto = {path = "../protos/"}
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
bytes = "1.11.1"
redis = { version = "0.24", features = ["tokio-comp"] }
governor = "0.6"
metrics = "0.23"
metrics-exporter-prometheus = "0.15.3"
uuid = { version = "1.6", features = ["v4"] }
subtle = "2.6"
base64 = "0.21.7"
graphql-parser = "0.3"

[build-dependencies]
tonic-build = "0.12.3"
