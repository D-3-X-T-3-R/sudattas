# Local development and VPS: MySQL, Redis, ntfy (admin push), Core Operations (gRPC), GraphQL, Caddy (reverse proxy)
# Run from backend/: docker-compose up -d --build
# Or use: .\start-services.ps1 / ./start-services.sh

services:
  mysql:
    build: ./database
    image: sudattas-mysql:local
    container_name: sudattas-mysql
    # Large mysqldump lines (e.g. BLOBs) exceed default packet size; restore/import needs this.
    command: --max_allowed_packet=1073741824
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: SUDATTAS
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sudattas-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Self-hosted push server for admin new-order alerts (see NTFY_* in .env.example).
  # Auth is on and anonymous access is denied; users/tokens live in the ntfy-data volume.
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: sudattas-ntfy
    command: serve
    ports:
      - "8090:80"
    environment:
      NTFY_BASE_URL: "${NTFY_BASE_URL:-http://localhost:8090}"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Relays a wake-up to ntfy.sh so the iOS app gets instant pushes (message body stays here).
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  core_operations:
    build:
      context: .
      dockerfile: Dockerfile.core_ops
    image: sudattas-core-operations:local
    container_name: sudattas-core-operations
    ports:
      - "127.0.0.1:50051:50051"
    env_file: .env
    environment:
      DATABASE_URL: "mysql://root:${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}@mysql:3306/SUDATTAS"
      REDIS_URL: redis://redis:6379
      GRPC_SERVER: "0.0.0.0:50051"
      # Publish to the bundled ntfy container unless .env points elsewhere (e.g. https://ntfy.sh).
      NTFY_URL: "${NTFY_URL:-http://ntfy}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  graphql:
    build:
      context: .
      dockerfile: Dockerfile.gq
    image: sudattas-graphql:local
    container_name: sudattas-graphql
    # Localhost only: the public reaches GraphQL through Caddy. That's also what makes trusting
    # X-Real-IP / X-Forwarded-For below safe — nobody outside can call :8080 with forged headers.
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      GRPC_URL: http://core_operations:50051
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_TRUST_PROXY_HEADERS: "true"
    depends_on:
      core_operations:
        condition: service_started
      redis:
        condition: service_healthy

  # Reverse proxy / single public entry point (see Caddyfile): backend paths -> graphql,
  # everything else -> the Next.js frontend running on the host.
  # Local:  http://localhost:8000 (point `cloudflared tunnel --url` here).
  # VPS:    SITE_ADDRESS=<domain>, CADDY_HTTP_PUBLISH=80:80, CADDY_HTTPS_PUBLISH=443:443.
  caddy:
    image: caddy:2.8.4-alpine
    container_name: sudattas-caddy
    ports:
      - "${CADDY_HTTP_PUBLISH:-8000:80}"
      - "${CADDY_HTTPS_PUBLISH:-127.0.0.1:8443:443}"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      FRONTEND_UPSTREAM: "${FRONTEND_UPSTREAM:-host.docker.internal:3000}"
    extra_hosts:
      # Docker Desktop provides host.docker.internal; Linux (the VPS) needs this mapping.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ntfy-data:
  caddy-data:
  caddy-config:
